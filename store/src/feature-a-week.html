<!doctype html><html><head><meta charset="utf-8">
<!-- Feature graphic, concept A "a week of wallpapers" (wallscout-design/feature-graphic-A-layout.svg) with NASA images. -->
<style>@import url("https://fonts.googleapis.com/css2?family=Roboto:wght@400;700&display=block");html,body{margin:0;width:1024px;height:500px;overflow:hidden;background:#121219}svg{display:block}</style></head><body>
<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="1024" height="500" viewBox="0 0 1024 500">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#FFB547"/><stop offset="1" stop-color="#FF4F7B"/></linearGradient>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#7DBDEB"/><stop offset="1" stop-color="#FFDDB8"/></linearGradient>
    <linearGradient id="p1" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#0B1030"/><stop offset=".6" stop-color="#3A2A6E"/><stop offset="1" stop-color="#E07A5F"/></linearGradient>
    <linearGradient id="p2" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#14304A"/><stop offset="1" stop-color="#C8946A"/></linearGradient>
    <linearGradient id="p3" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#2B0F3A"/><stop offset=".5" stop-color="#A33B6B"/><stop offset="1" stop-color="#F3A65B"/></linearGradient>
    <linearGradient id="p4" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#061A2B"/><stop offset="1" stop-color="#2E7D8C"/></linearGradient>
    <clipPath id="s0"><rect width="104" height="210" rx="14"/></clipPath><clipPath id="s1"><rect width="104" height="210" rx="14"/></clipPath><clipPath id="s2"><rect width="104" height="210" rx="14"/></clipPath><clipPath id="s3"><rect width="104" height="210" rx="14"/></clipPath><clipPath id="ln"><circle cx="30.6" cy="29.6" r="18.6"/></clipPath>
  </defs>
  <rect width="1024" height="500" fill="#121219"/>

  <!-- Lockup: icon mark (72 units scaled to ~66px) + Wall / scout -->
  <g transform="translate(56 73) scale(0.92)">
    <circle cx="36" cy="36" r="36" fill="url(#bg)"/>
    <g clip-path="url(#ln)">
      <rect x="10" y="9" width="42" height="42" fill="url(#sky)"/>
      <circle cx="39" cy="20.5" r="4.3" fill="#FFB547"/>
      <path d="M11 41.5l10.2-10.8 7.8 7.8 6-5.4 15.6 12.6V49H11z" fill="#3C3489"/>
      <path d="M11 46.8l12-6.6 9.6 4.8 7.2-3.6 11.2 5.8V49H11z" fill="#1E1A4F"/>
    </g>
    <path d="M18.4 21.2a14.4 14.4 0 0 1 7.2-5.4" stroke="#fff" stroke-width="2.6" fill="none" stroke-linecap="round"/>
    <circle cx="30.6" cy="29.6" r="18.6" fill="none" stroke="#fff" stroke-width="5.3"/>
    <path d="M45.3 44.3l9.4 9.4" stroke="#fff" stroke-width="7.8" stroke-linecap="round"/>
  </g>
  <text x="137" y="127" font-family="Roboto, sans-serif" font-size="58"><tspan fill="#F1EEF6">Wall</tspan><tspan fill="#FF9466" font-weight="700">scout</tspan></text>

  <!-- Headline -->
  <text x="60" y="230" font-family="Roboto, sans-serif" font-size="40" font-weight="700" fill="#F1EEF6">A new wallpaper,</text>
  <text x="60" y="280" font-family="Roboto, sans-serif" font-size="40" font-weight="700" fill="#F1EEF6">found for you.</text>
  <text x="60" y="330" font-family="Roboto, sans-serif" font-size="28" fill="#FF9466">Every day. Automatically.</text>

  <!-- Four phones, fanned, labelled by day (screens: replace gradients with real wallpapers) -->
  <g font-family="Roboto, sans-serif" font-size="17" fill="#A5A9B4" text-anchor="middle">
    <g transform="translate(520 110) rotate(-8)"><image href="nasa/GSFC_20171208_Archive_e000842.jpg" width="104" height="210" preserveAspectRatio="xMidYMid slice" clip-path="url(#s0)"/><rect width="104" height="210" rx="14" fill="none" stroke="#2A2A33" stroke-width="4"/></g><text x="580" y="372">Mon</text>
    <g transform="translate(640 95) rotate(-3)"><image href="nasa/iss040e117958.jpg" width="104" height="210" preserveAspectRatio="xMidYMid slice" clip-path="url(#s1)"/><rect width="104" height="210" rx="14" fill="none" stroke="#2A2A33" stroke-width="4"/></g><text x="695" y="352">Tue</text>
    <g transform="translate(762 90) rotate(2)"><image href="nasa/PIA26718.jpg" width="104" height="210" preserveAspectRatio="xMidYMid slice" clip-path="url(#s2)"/><rect width="104" height="210" rx="14" fill="none" stroke="#2A2A33" stroke-width="4"/></g><text x="810" y="350">Wed</text>
    <g transform="translate(882 98) rotate(7)"><image href="nasa/GSFC_20171208_Archive_e002076.jpg" width="104" height="210" preserveAspectRatio="xMidYMid slice" clip-path="url(#s3)"/><rect width="104" height="210" rx="14" fill="none" stroke="#2A2A33" stroke-width="4"/></g><text x="922" y="366">Thu</text>
  </g>
  <text x="764" y="430" font-family="Roboto, sans-serif" font-size="18" fill="#6E7280" text-anchor="middle">…and every day after</text>
</svg>

</body></html>
